name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        name: PHP quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, mbstring, pdo_sqlite, sqlite3
                  tools: composer:v2
                  coverage: none

            - name: Validate Composer configuration
              run: composer validate --strict

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-8.4-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-8.4-

            - name: Install dependencies
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Build Tailwind assets
              run: php bin/console tailwind:build --no-interaction --env=test

            - name: Check PHP syntax
              run: find src tests migrations -type f -name '*.php' -print0 | xargs -0 -n1 php -l

            - name: Check coding standards
              run: composer cs-check

            - name: Run PHPStan level 10
              run: php vendor/bin/phpstan analyse --no-progress --debug

            - name: Lint Symfony container and Twig
              run: composer lint

            - name: Run database migrations
              run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

            - name: Validate Doctrine mapping
              run: php bin/console doctrine:schema:validate --env=test

            - name: Run unit and functional tests
              run: composer test -- --no-coverage
